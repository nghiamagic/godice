

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>GoDice BLE Pro</title>

<meta
  name="theme-color"
  content="#111827"
/>

<link
  rel="stylesheet"
  href="style.css"
/>



<h1>🎲 GoDice BLE Pro</h1>

<button id="connectBtn">
  Connect
</button>

<button id="disconnectBtn">
  Disconnect
</button>

<button id="sleepBtn">
  Sleep Mode
</button>

<div class="card">

  <div class="row">
    <span class="label">Device:</span>
    <span class="value" id="deviceName">-</span>
  </div>

  <div class="row">
    <span class="label">Battery:</span>
    <span class="value" id="battery">-</span>
  </div>

  <div class="row">
    <span class="label">Face:</span>
    <span class="value" id="faceValue">-</span>
  </div>

  <div class="row">
    <span class="label">Orientation:</span>
    <span class="value" id="orientation">-</span>
  </div>

  <div
    class="status disconnected"
    id="status"
  >
    Disconnected
  </div>

  <div
    class="dice"
    id="dice"
  >
    ⚀
  </div>

</div>

<div class="card">

  <h3>BLE Log</h3>

  <pre id="log"></pre>

</div>

<script
  type="module"
  src="firebase.js"
></script>

<script
  type="module"
  src="app.js"
></script>
